name: Build Fine Volume APK

on:
  push:
    branches: [claude/android-volume-control-app-u30obp]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A build this small has no business taking longer than this. Fail fast
    # rather than sit on a blocked prompt for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install SDK components up front
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        # stdin from /dev/null so anything that tries to prompt dies immediately
        # instead of hanging the job.
        run: gradle --no-daemon --stacktrace assembleDebug < /dev/null

      - name: Name the APK after the run
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/fine-volume-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fine-volume-apk
          path: out/*.apk

      - name: Publish this build to its own permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        # One immutable release per build. The previous approach deleted and recreated a
        # rolling 'latest' tag, which meant the asset a browser had been pointed at could
        # vanish mid-download — release downloads redirect to a signed URL tied to a
        # specific asset object, so a retry against a deleted one stalls at zero bytes
        # forever while still claiming to be downloading.
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" out/*.apk \
            --title "Fine Volume build ${GITHUB_RUN_NUMBER}" \
            --notes "Commit ${GITHUB_SHA:0:7}. Open this page on the phone and tap the APK to install." \
            --prerelease
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
